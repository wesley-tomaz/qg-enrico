<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QG Enrico">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<title>QG do Enrico</title>
<style>
:root{
  --bg:#000; --s1:#1C1C1E; --s2:#2C2C2E; --s3:#3A3A3C; --hair:rgba(255,255,255,.08);
  --t1:#FFFFFF; --t2:#8E8E93; --t3:#636366;
  --r1:#FA114F; --r2:#A6FF00; --r3:#00E0FF; --blue:#0A84FF;
  --vw:100vw; --vh:100vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body{min-height:100vh;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
svg{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(104px + env(safe-area-inset-bottom))}
#screen{animation:in .38s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.04em}
.large{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.title2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 2px 12px}
.sec h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
.sec a,.sec button{font-size:15px;color:var(--blue);font-weight:500}
.card{background:var(--s1);border-radius:22px;padding:18px}
.muted{color:var(--t2)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#3A3A3C,#1C1C1E);display:grid;place-items:center;font-weight:700;font-size:18px;position:relative;flex:none}
.avatar svg{position:absolute;inset:-4px}
/* anéis */
.rings{display:flex;align-items:center;gap:20px;margin-top:22px}
.rlegend{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.rl .k{font-size:15px;font-weight:600}
.rl .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.rl .v small{font-size:15px;font-weight:600;margin-left:2px}
.arc{animation:draw 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--c)}}
/* hero */
.hero{position:relative;display:block;width:100%;border-radius:24px;overflow:hidden;background:var(--s1);margin-top:26px}
.hero .th{aspect-ratio:16/9}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.92) 100%)}
.hero .info{position:absolute;left:18px;right:18px;bottom:16px}
.hero .t{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.hero .playb{position:absolute;right:16px;top:16px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);color:#000;display:grid;place-items:center;backdrop-filter:blur(10px)}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pbar{height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c,#fff);border-radius:4px;transition:width .4s}
/* miniaturas */
.th{position:relative;width:100%;background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--c) 55%,#000) 0%,#111 70%);display:grid;place-items:center;overflow:hidden;color:color-mix(in srgb,var(--c) 85%,#fff)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .ic{width:34%;max-width:72px;opacity:.9}
.rail{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:18px;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{flex:0 0 64%;max-width:260px;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-start}
.tile .th{aspect-ratio:16/9;border-radius:16px}
.tile .tt{font-size:15px;font-weight:600;margin-top:8px;line-height:1.25}
.tile .ts{font-size:13px;color:var(--t2);margin-top:2px}
.tile.lock{opacity:.4}
/* complicações */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.comp{background:var(--s1);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:132px;text-align:left}
.comp .top{display:flex;justify-content:space-between;align-items:flex-start}
.comp .nm{font-size:15px;font-weight:600;line-height:1.2}
.comp .sb{font-size:13px;color:var(--t2);margin-top:2px}
.comp.lock .nm{color:var(--t2)}
.mini{position:relative;width:46px;height:46px}
.mini>.ic{position:absolute;inset:12px;width:auto;height:auto;display:grid;place-items:center;color:var(--c)}
/* listas */
.list{background:var(--s1);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;position:relative}
.row+.row:before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.row .rt span{display:block;font-size:13px;color:var(--t2);margin-top:2px}
.row .thm{width:92px;flex:none;border-radius:10px;overflow:hidden}
.row .thm .th{aspect-ratio:16/9}
.row.cur{background:color-mix(in srgb,var(--c) 9%,#1C1C1E)}
.badge{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.badge.ok{background:var(--c);color:#000}
.badge.nx{border:2px solid var(--c)}
.chev{color:var(--t3);width:18px;flex:none}
/* temporada */
.shead{display:flex;align-items:center;gap:18px;margin:6px 0 22px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;margin:-4px 0 10px -6px;padding:4px}
.lockbox{text-align:center;padding:34px 18px}
.lockbox .ic{width:44px;margin:0 auto 12px;color:var(--t2)}
/* player */
.pwrap{margin:0 -18px}
#pbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
#pbox iframe,#pbox #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.pctl{display:flex;align-items:center;gap:12px;padding:12px 18px 0}
.pctl .pbar{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.pill .ic{width:16px}
.ept{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:18px}
.epd{font-size:16px;color:var(--t2);line-height:1.4;margin-top:8px}
.over{position:absolute;inset:0;z-index:6;display:grid;place-items:center;text-align:center;padding:16px;background:rgba(0,0,0,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.over .big{font-size:22px;font-weight:700;letter-spacing:-.02em}
.over .sm{font-size:14px;color:var(--t2);margin-top:4px}
.btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn{background:#fff;color:#000;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px}
.btn.gh{background:rgba(255,255,255,.14);color:#fff}
.btn.full{display:block;width:100%;text-align:center;padding:15px;border-radius:16px;font-size:17px}
.xbtn{position:absolute;top:12px;left:12px;z-index:8;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:none;place-items:center;backdrop-filter:blur(10px)}
.xbtn .ic{width:20px}
/* modo cinema */
body.cinema{overflow:hidden}
body.cinema #tabbar{display:none}
body.cinema #pbox{position:fixed;inset:0;z-index:100;width:var(--vw);height:var(--vh);aspect-ratio:auto}
body.cinema.rot #pbox{inset:auto;top:0;left:0;width:var(--vh);height:var(--vw);transform-origin:top left;transform:translateX(var(--vw)) rotate(90deg)}
body.cinema .xbtn{display:grid}
/* mistério */
.myst{perspective:1200px;margin-top:22px}
.myst .in{position:relative;min-height:168px;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.myst.flip .in{transform:rotateY(180deg)}
.myst .f{position:absolute;inset:0;border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.myst .fr{background:linear-gradient(140deg,#2A1B4A,#1C1C1E 70%)}
.myst .bk{background:linear-gradient(140deg,#0E3A2F,#1C1C1E 70%);transform:rotateY(180deg)}
.myst .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#BF9CFF;margin-bottom:8px}
.myst .bk .k{color:#5BE7A9}
.myst .k .ic{width:14px}
.myst .q{font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.myst .h{font-size:13px;color:var(--t2);margin-top:12px;display:flex;align-items:center;gap:6px}
.myst .h .ic{width:14px}
/* barras */
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:14px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:26px;border-radius:6px;background:var(--r2);min-height:3px;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bars .b.off i{background:var(--s3)}
.bars .b span{font-size:11px;color:var(--t2)}
.bars .b.today span{color:var(--t1);font-weight:700}
@keyframes grow{from{transform:scaleY(0)}}
.goal{position:relative}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--s1);border-radius:18px;padding:14px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat .k{font-size:13px;color:var(--t2);margin-top:2px}
/* conquistas */
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px}
.aw{text-align:center}
.medal{width:86px;height:86px;margin:0 auto;border-radius:50%;display:grid;place-items:center;position:relative}
.medal .ic{width:36px;color:#fff;position:relative;z-index:1}
.medal.on{background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,#000),0 0 26px color-mix(in srgb,var(--c) 45%,transparent)}
.medal.off{background:var(--s1);box-shadow:inset 0 0 0 2px var(--s2)}
.medal.off .ic{color:var(--t3)}
.aw b{display:block;font-size:13px;font-weight:600;margin-top:10px;line-height:1.2}
.aw span{display:block;font-size:11px;color:var(--t2);margin-top:3px;line-height:1.25}
/* modal de conquista */
#modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:grid;place-items:center;text-align:center;padding:30px;animation:fade .3s}
#modal[hidden]{display:none}
#modal .medal{width:150px;height:150px;animation:pop .9s cubic-bezier(.2,1.5,.4,1) both}
#modal .medal .ic{width:64px}
#modal h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:26px}
#modal p{color:var(--t2);font-size:16px;margin:8px auto 26px;max-width:300px;line-height:1.4}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
/* abas */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(18,18,20,.82);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid rgba(255,255,255,.1);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabbar .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--t3);padding:4px 10px;min-width:62px}
#tabbar button .ic{width:25px;height:25px}
#tabbar button.on{color:var(--t1)}
#tabbar button[hidden]{display:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-160%);transition:transform .5s cubic-bezier(.2,1.3,.4,1);z-index:300;background:rgba(44,44,46,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:10px 18px 10px 12px;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#toast.show{transform:translate(-50%,0)}
#toast .ti{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c,#30D158);color:#000;flex:none}
#toast .ti .ic{width:18px}
#toast b{font-size:15px;display:block}
#toast span{font-size:13px;color:var(--t2)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:250}
.loading{min-height:80vh;display:grid;place-items:center}
.pai{background:#1F1405;color:#FFB340;border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:16px;line-height:1.35}
.demo{font-size:12px;color:var(--t3);text-align:center;margin-top:26px}
.demo button{color:var(--blue)}
.install{display:flex;gap:14px;align-items:center;margin-top:16px}
.install .ic{width:28px;color:var(--blue);flex:none}
.install p{font-size:13px;color:var(--t2);line-height:1.35;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 4px;text-align:left;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:12px;color:var(--t2);font-weight:600}
.ic{display:block;width:100%;height:auto}
div.ic>svg.ic,.ic>svg{position:static!important;inset:auto!important;width:100%!important;max-width:none!important;margin:0!important}
</style>
</head>
<body>
<div id="app"><div class="loading"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#2C2C2E" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="#FA114F" stroke-width="7" stroke-linecap="round" stroke-dasharray="40 200" transform="rotate(-90 32 32)"><animateTransform attributeName="transform" type="rotate" from="-90 32 32" to="270 32 32" dur="1s" repeatCount="indefinite"/></circle></svg></div></div>
<nav id="tabbar" hidden><div class="in">
  <button data-go="inicio" id="tb-inicio"></button>
  <button data-go="trilha" id="tb-trilha"></button>
  <button data-go="atividade" id="tb-atividade"></button>
  <button data-go="conquistas" id="tb-conquistas"></button>
</div></nav>
<div id="toast"></div>
<div id="modal" hidden></div>
<canvas id="fx"></canvas>

<script>
/* ============ Configuração ============ */
const CONFIG = {
  nome: 'Enrico',
  metaMinutosSemana: 30,   // anel verde
  metaDiasSemana: 3,       // anel azul
  liberarAutoEm: 0.75,     // temporada AUTO abre com 75% da anterior concluída
  concluirEm: 0.9,         // chegar a 90% do vídeo
  minAssistido: 0.6,       // e ter assistido de fato 60% do tempo
  enviarCada: 20,          // segundos entre envios ao servidor
  proximoEm: 6             // segundos da contagem para o próximo episódio
};
const NIVEIS = [[0,'Curioso'],[3,'Aprendiz'],[7,'Poupador'],[12,'Estrategista'],[18,'Investidor'],[24,'Mestre do Dinheiro']];

/* ============ Ícones ============ */
const P = {
  play:'<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  lock:'<rect x="5" y="11" width="14" height="9.5" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  chevL:'<path d="M15 4.5L7.5 12 15 19.5"/>',
  chevR:'<path d="M9.5 5l7 7-7 7"/>',
  expand:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
  trilha:'<path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>',
  atividade:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="2"/>',
  medal:'<circle cx="12" cy="14.5" r="5.5"/><path d="M8.5 10L6 3.5h4l2 4.5 2-4.5h4L15.5 10"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>',
  spark:'<path d="M12 3l2 6.5L20.5 12 14 14l-2 7-2-7-6.5-2L10 9.5z"/>',
  coin:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5.5"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  building:'<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>',
  btc:'<path d="M8 5h6a3 3 0 0 1 0 6H8zM8 11h7a3 3 0 0 1 0 6H8zM8 5v12M10 3v2M13 3v2M10 17v2M13 17v2"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  flame:'<path d="M12 3c1 4 5.5 5.5 5.5 10.5a5.5 5.5 0 0 1-11 0c0-3 2-4.5 2-7.5 1.5 1 2.6 2.4 3 4.2.6-3 .5-5.2.5-7.2z"/>',
  mountain:'<path d="M3 20l6.5-11 4 6.5 3-4L21 20z"/>',
  half:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  star:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/>',
  arrow:'<path d="M12 20V5M6 11l6-6 6 6"/>',
  sparkles:'<path d="M12 4l1.4 4.6L18 10l-4.6 1.4L12 16l-1.4-4.6L6 10l4.6-1.4zM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>'
};
function ic(n, extra) { const p = P[n]; if (!p) return '<span style="font-size:20px;font-weight:700">' + esc(n || '') + '</span>'; return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' + (extra || '') + '>' + p + '</svg>'; }

/* ============ Estado e dados ============ */
const PREVIA = location.protocol === 'file:' || /claude|anthropic|localhost/.test(location.hostname);
const IS_GAS = !PREVIA; // true = app real (vídeos do YouTube)
const STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const S = { temporadas: [], episodios: [], prog: {}, dias: {}, eventos: [], modoPai: false, tela: 'inicio', temp: null, ep: null, ganhas: null, abertas: null };

/* ============ Utilidades ============ */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function iso(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function addDias(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function segDe(v) { v = String(v || '').trim(); if (!v) return 0; return v.split(':').map(Number).reduce((a, b) => a * 60 + (b || 0), 0); }
function ytId(u) { u = String(u || '').trim(); if (!u) return ''; if (/^[\w-]{11}$/.test(u)) return u; const m = u.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/); return m ? m[1] : ''; }
function min(s) { return Math.round((s || 0) / 60); }
function cor(t) { return (t && t.cor) || '#0A84FF'; }
function $(id) { return document.getElementById(id); }
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

/* ============ Modelo ============ */
function temps() { return S.temporadas.slice().sort((a, b) => +a.numero - +b.numero); }
function tempDe(n) { return S.temporadas.find(t => +t.numero === +n); }
function epsDe(n) { return S.episodios.filter(e => +e.temporada === +n).sort((a, b) => +a.ordem - +b.ordem); }
function epDe(id) { return S.episodios.find(e => e.id === id); }
function prog(id) { return S.prog[id] || (S.prog[id] = { seg: 0, pct: 0, concluido: false, revelou: false, ultimo: null }); }
function feitosDe(n) { return epsDe(n).filter(e => prog(e.id).concluido).length; }
function liberada(t) { return true; }
function faltamPara(t) { const ant = temps().filter(x => +x.numero < +t.numero).pop(); if (!ant) return 0; return Math.max(0, Math.ceil(epsDe(ant.numero).length * CONFIG.liberarAutoEm) - feitosDe(ant.numero)); }
function status(e) { if (!ytId(e.youtube) && e.youtube !== 'demo') return 'breve'; return prog(e.id).concluido ? 'feito' : 'aberto'; }
function proximo(depoisDe) {
  const lista = [];
  temps().forEach(t => { if (liberada(t)) epsDe(t.numero).forEach(e => lista.push(e)); });
  if (depoisDe) { const i = lista.findIndex(e => e.id === depoisDe); const r = lista.slice(i + 1).concat(lista.slice(0, Math.max(0, i))).find(e => status(e) === 'aberto'); return r || null; }
  return lista.find(e => status(e) === 'aberto' && prog(e.id).pct > 0.02) || lista.find(e => status(e) === 'aberto') || null;
}
function totais() {
  const total = S.episodios.length, feitos = S.episodios.filter(e => prog(e.id).concluido).length;
  const seg = Object.values(S.prog).reduce((a, p) => a + (p.seg || 0), 0), rev = Object.values(S.prog).filter(p => p.revelou).length;
  return { total, feitos, seg, rev, pct: total ? feitos / total : 0 };
}
function inicioSemana(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function semana(ref) {
  const ini = inicioSemana(ref || new Date()), dias = [];
  for (let i = 0; i < 7; i++) { const d = addDias(ini, i), k = iso(d); dias.push({ d, k, seg: S.dias[k] || 0 }); }
  return { ini, dias, seg: dias.reduce((a, x) => a + x.seg, 0), ativos: dias.filter(x => x.seg >= 60).length };
}
function aneis() { const t = totais(), s = semana(); return { j: t.pct, m: s.seg / 60 / CONFIG.metaMinutosSemana, d: s.ativos / CONFIG.metaDiasSemana, t, s }; }
function nivel(f) { let i = 0; NIVEIS.forEach((n, k) => { if (f >= n[0]) i = k; }); const p = NIVEIS[i + 1]; return { n: i + 1, nome: NIVEIS[i][1], prox: p ? p[1] : null, falta: p ? p[0] - f : 0, frac: p ? (f - NIVEIS[i][0]) / (p[0] - NIVEIS[i][0]) : 1 }; }

  return ks.some(k => { const w = iso(inicioSemana(new Date(k + 'T12:00:00'))); if (vistas[w]) return false; vistas[w] = 1; const s = semana(new Date(k + 'T12:00:00')); return s.seg >= CONFIG.metaMinutosSemana * 60 && s.ativos >= CONFIG.metaDiasSemana; });
}

let gid = 0;
function anel3(size, vals, sw) {

  vals.forEach((v, i) => { const r = size / 2 - sw / 2 - i * (sw + gap); if (r <= 0) return; const c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, v || 0));

    if (f > 0.004) s += '<circle class="arc" style="--c:' + c.toFixed(1) + 'px;animation-delay:' + (i * 0.12) + 's" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="url(#g' + k + i + ')" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>'; });

function anel1(size, f, c, sw) {

  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + c + '" stroke-opacity=".22" stroke-width="' + sw + '"/>' + (f > 0.004 ? '<circle class="arc" style="--c:' + C.toFixed(1) + 'px" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + c + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + (C * f).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' : '') + '</svg>';
